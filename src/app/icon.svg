<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Duru Gencay">
  <!-- Aurora tile — the design-token gradient (teal → cyan → violet), using the
       deepened light-theme stops so the white monogram keeps ~3.5:1 contrast
       against every point of the ramp. Mirrors the aurora token in globals.css. -->
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d9488" />
      <stop offset="0.42" stop-color="#0891b2" />
      <stop offset="1" stop-color="#7c3aed" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#aurora)" />
  <!-- Glass edge: keeps the tile from dissolving into a light browser chrome. -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none"
        stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" />
  <!-- DG monogram drawn as strokes, not text, so it needs no font at render
       time and stays identical in the .ico / apple-icon rasterizations.
       The G's circle overshoots the D's flat top/bottom by 0.5u — the usual
       optical correction so the round letter doesn't read as smaller. -->
  <g fill="none" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 44V20h6a8.5 12 0 0 1 0 24Z" />
    <path d="M52.34 23.16A12.5 12.5 0 1 0 56 32H45.5" />
  </g>
</svg>
